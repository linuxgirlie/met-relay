<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MetRelay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;background:#0B1220;color:#fff;min-height:100vh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
main{width:min(980px,100%);padding:40px 20px}
.k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6B9BF5}
h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.04em;margin:10px 0 36px;font-weight:800;line-height:1.02}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:760px){.g{grid-template-columns:1fr}}
a{display:flex;flex-direction:column;gap:40px;background:#131B2B;border:1px solid #1F2A3D;border-radius:18px;padding:22px;color:#fff;text-decoration:none;transition:border-color .15s,transform .15s}
a:hover{border-color:#1558D6;transform:translateY(-2px)}
a span{font-size:12px;font-weight:700;color:#6B7A90;letter-spacing:.1em}a b{font-size:20px;letter-spacing:-.02em}
</style></head>
<body><main><div class="k">MetRelay</div><h1>Observation to action,<br>in minutes</h1>
<div class="g"><a href="/capture/"><span>01 GATHER</span><b>Capture</b></a><a href="/console/"><span>02 PROCESS</span><b>Desk</b></a><a href="/climweb/"><span>03 DISSEMINATE</span><b>Public warnings</b></a></div>
</main></body></html>
